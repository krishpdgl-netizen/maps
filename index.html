<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Field Rep Map — Log in</title>
<style>
  :root {
    --accent: #1a73e8;
    --accent-dark: #174ea6;
    --red: #d93025;
    --border: #dadce0;
    --text-primary: #202124;
    --text-secondary: #5f6368;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
  }
  .login-screen {
    width: 100%;
    max-width: 420px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: max(60px, env(safe-area-inset-top)) 28px 40px;
  }
  .login-logo {
    width: 56px; height: 56px; border-radius: 16px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
  }
  .login-logo svg { width: 28px; height: 28px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 32px; }
  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .login-field input {
    width: 100%; height: 46px; border-radius: 10px; border: 1.5px solid var(--border);
    padding: 0 14px; font-size: 15px; outline: none;
  }
  .login-field input:focus { border-color: var(--accent); }
  .login-error { font-size: 12.5px; color: var(--red); min-height: 16px; margin: -6px 0 10px; }
  .login-locked-banner {
    background: #fce8e6; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
    font-size: 12.5px; color: #8f1e1a; line-height: 1.5; display: none;
  }
  .login-locked-banner.show { display: block; }
  .login-btn {
    height: 48px; border-radius: 10px; border: none; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .login-btn:active { background: var(--accent-dark); }
  .login-btn[disabled] { opacity: 0.6; pointer-events: none; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-screen">
  <div class="login-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3" fill="#fff" stroke="none"/></svg>
  </div>
  <h1>Field Rep Map</h1>
  <p class="sub">Log in to see your assigned customers</p>
  <div class="login-locked-banner" id="lockedBanner"></div>
  <div class="login-field">
    <label>Employee ID</label>
    <input id="loginId" type="text" placeholder="EMP001" autocomplete="off">
  </div>
  <div class="login-field">
    <label>Password</label>
    <input id="loginPw" type="password" placeholder="Enter your password">
  </div>
  <p class="login-error" id="loginError"></p>
  <button class="login-btn" id="loginBtn" onclick="doLogin()">Log in</button>
</div>

<script>
async function doLogin() {
  const employeeId = document.getElementById('loginId').value.trim();
  const password = document.getElementById('loginPw').value;
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errorEl.textContent = '';

  if (!employeeId || !password) {
    errorEl.textContent = 'Enter your employee ID and password.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ employeeId, password }),
    });
    const data = await res.json();

    if (!data.success) {
      btn.disabled = false;
      btn.textContent = 'Log in';
      const banner = document.getElementById('lockedBanner');
      if (res.status === 429) {
        banner.textContent = data.message;
        banner.classList.add('show');
      } else {
        errorEl.textContent = data.message || 'Invalid ID or password.';
      }
      return;
    }

    // Session cookie is set — move to the dashboard.
    window.location.href = '/dashboard.html';
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Log in';
    errorEl.textContent = 'Network error. Try again.';
  }
}

document.getElementById('loginPw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>

</body>
</html>
